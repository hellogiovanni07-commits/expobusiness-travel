<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Web banner 728x90 · ExpoBusiness Travel Services</title>
<link rel="stylesheet" href="collateral.css">
<style>
  :root { --w: 728px; --h: 90px; }
  @page { size: 728px 90px; margin: 0; }
  .bg { background: var(--navy); }
  .glow { position: absolute; left: 330px; top: -120px; width: 360px; height: 300px; background: radial-gradient(closest-side, rgba(242,106,27,.3), transparent); }
  .trim { display: flex; align-items: center; height: 100%; padding: 0 18px 4px 20px; gap: 20px; }
  .logo { height: 30px; flex: none; }
  .vr { width: 1px; height: 46px; background: rgba(255,255,255,.18); flex: none; }
  .msg { flex: 1; min-width: 0; }
  .msg b { display: block; font: 800 17px/1.1 var(--fh); color: #fff; white-space: nowrap; letter-spacing: -.02em; }
  .msg b em { font-style: normal; color: var(--or-hot); }
  .msg span { display: block; margin-top: 4px; font-size: 11.5px; color: var(--navy-soft); }
  .cta { flex: none; display: inline-flex; align-items: center; gap: 6px; background: var(--or-ink); color: #fff; font: 700 13px/1 var(--fh); padding: 12px 16px; border-radius: 99px; }
  .cta .ic { width: 14px; height: 14px; }
  .base { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; }
</style>
</head>
<body class="solo">
<section class="page">
  <div class="bg"></div><div class="glow"></div>
  <div class="trim">
    <img class="logo" src="../img/logo/expobusiness-horizontal-reverse.svg" alt="ExpoBusiness Travel Services">
    <span class="vr"></span>
    <div class="msg"><b>Your 2027 trade show trip, <em>one coordinator.</em></b><span>Registration, flights, hotels and visas, itemised.</span></div>
    <span class="cta">Plan a show trip <i class="ic" data-i="arrow"></i></span>
  </div>
  <div class="base stripe"></div>
</section>
<script src="collateral.js"></script>
</body>
</html>
