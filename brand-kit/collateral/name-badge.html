<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Delegation name badge · ExpoBusiness Travel Services</title>
<link rel="stylesheet" href="collateral.css">
<style>
  :root { --w: 90mm; --h: 120mm; --bl: 3mm; }
  @page { size: 96mm 126mm; margin: 0; }
  .head { position: absolute; left: 0; right: 0; top: 0; height: calc(31mm + var(--bl)); background: var(--navy); }
  .head .glow { position: absolute; right: -20mm; top: -30mm; width: 70mm; height: 70mm; background: radial-gradient(closest-side, rgba(242,106,27,.35), transparent); }
  .head .stripe { position: absolute; left: 0; right: 0; bottom: 0; height: 1.4mm; }
  .trim { display: flex; flex-direction: column; }
  .top { height: 31mm; padding: 0 7mm; display: flex; align-items: center; justify-content: space-between; position: relative; }
  .top img { height: 8.2mm; }
  .top span { font: 700 5.6pt/1.2 var(--fh); letter-spacing: .16em; text-transform: uppercase; color: #ffb27d; text-align: right; }
  .who { padding: 9mm 7mm 0; }
  .who .first { font: 800 30pt/1 var(--fh); color: var(--navy); letter-spacing: -.03em; }
  .who .last { font: 700 15pt/1.1 var(--fh); color: var(--navy); margin-top: 1.5mm; letter-spacing: -.02em; }
  .who .pos { margin-top: 4mm; font: 600 8.6pt/1.3 var(--fb); }
  .who .co { margin-top: 1mm; font: 500 8.4pt/1.3 var(--fb); color: var(--ink-2); }
  .trip { margin: auto 7mm 0; padding: 3.2mm 3.8mm; background: var(--cloud); border-left: 1.6mm solid var(--or); }
  .trip .label { display: block; color: var(--or-ink); margin-bottom: 1mm; font-size: 5.6pt; }
  .trip b { display: block; font: 700 9pt/1.25 var(--fh); color: var(--navy); }
  .trip span.v { font-size: 7.2pt; color: var(--ink-2); }
  .foot { margin: 5mm 7mm 0; height: 16mm; border-top: 1px solid var(--line); display: flex; align-items: center; }
  .foot .lockup { --lk-h: 6.5mm; --lk-p: 9.5mm; --lk-gap: 3.2mm; }
</style>
</head>
<body>
<section class="page">
  <div class="head"><div class="glow"></div><div class="stripe"></div></div>
  <div class="trim">
    <div class="top"><img src="../img/logo/expobusiness-horizontal-reverse.svg" alt="ExpoBusiness Travel Services"><span>Delegation</span></div>
    <div class="who">
      <p class="first ph" style="font-weight:800">[First name]</p>
      <p class="last ph" style="font-weight:700">[Last name]</p>
      <p class="pos ph">[Position]</p>
      <p class="co ph" style="font-weight:500">[Company]</p>
    </div>
    <div class="trip">
      <span class="label">Trip</span>
      <b class="ph">[Event or mission name]</b>
      <span class="v ph" style="font-weight:500">[City, country · dates]</span>
    </div>
    <div class="foot">
      <div class="lockup">
        <img class="eb" src="../img/logo/expobusiness-horizontal-colour.svg" alt="ExpoBusiness Travel Services">
        <span class="rule"></span>
        <div class="partner"><small>In partnership<br>with</small><img src="img/immaculate-connections.png" alt="Immaculate Connections Tour Services"></div>
      </div>
    </div>
  </div>
</section>
<script src="collateral.js"></script>
</body>
</html>
