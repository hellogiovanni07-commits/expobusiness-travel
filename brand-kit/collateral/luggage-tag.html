<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Luggage tag · ExpoBusiness Travel Services</title>
<link rel="stylesheet" href="collateral.css">
<style>
  :root { --w: 55mm; --h: 110mm; --bl: 3mm; }
  @page { size: 61mm 116mm; margin: 0; }
  .hole { position: absolute; left: 50%; top: 9mm; width: 6mm; height: 6mm; margin-left: -3mm; border-radius: 50%; border: .3mm dashed currentColor; }
  .front .bg { background: var(--navy); }
  .front .glow { position: absolute; left: -20mm; bottom: -20mm; width: 90mm; height: 90mm; background: radial-gradient(closest-side, rgba(242,106,27,.35), transparent); }
  .front .trim { color: rgba(255,255,255,.5); }
  .front .stk { position: absolute; left: 7mm; top: 21mm; width: 34mm; }
  .front .grp { position: absolute; left: 7mm; right: 7mm; top: 52mm; font: 700 7pt/1.3 var(--fh); letter-spacing: .06em; }
  .front .mark { position: absolute; left: 8mm; top: 24mm; width: 22mm; }
  .front .bigbars { position: absolute; right: 6mm; bottom: 0; width: 22mm; height: 46mm; gap: 2mm; }
  .front .arc { position: absolute; right: 2mm; bottom: 28mm; width: 40mm; }
  .front .txt { position: absolute; left: 8mm; top: 46mm; right: 6mm; }
  .front .txt b { display: block; font: 800 13pt/1.05 var(--fh); color: #fff; letter-spacing: -.02em; }
  .front .txt b em { font-style: normal; color: var(--or-hot); }
  .front .txt span { display: block; margin-top: 2mm; font: 600 6.4pt/1.3 var(--fh); letter-spacing: .12em; text-transform: uppercase; color: #ffb27d; }
  .front .base { position: absolute; left: 0; right: 0; bottom: 0; height: calc(1.6mm + var(--bl)); }
  .back .trim { padding: 19mm 6mm 0; display: flex; flex-direction: column; color: var(--mute); }
  .back h3 { font-size: 10pt; }
  .back .f { margin-top: 3.2mm; }
  .back .f .field { min-height: 5.6mm; font-size: 7pt; }
  .back .f .label { font-size: 5.2pt; display: block; margin-top: .8mm; }
  .back .co { margin-top: 4mm; padding: 2.4mm 2.8mm; background: var(--cloud); border-left: 1.2mm solid var(--or); font-size: 6.4pt; line-height: 1.45; color: var(--navy); }
  .back .co b { font: 700 6.4pt/1.3 var(--fh); letter-spacing: .1em; text-transform: uppercase; color: var(--or-ink); display: block; }
  .back .foot { margin-top: auto; height: 13mm; border-top: 1px solid var(--line); display: flex; align-items: center; }
  .back .foot .lockup { --lk-h: 4.4mm; --lk-p: 7mm; --lk-gap: 1.8mm; }
  .back .foot .lockup .partner small { font-size: 4.2pt; }
</style>
</head>
<body>
<section class="page front">
  <div class="bg"></div><div class="bg dotgrid" style="opacity:.6"></div><div class="glow"></div>
  <svg class="arc" viewBox="0 0 120 60" fill="none"><path d="M2 58 C 30 10, 80 0, 116 8" stroke="#d7261e" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 5"/></svg>
  <div class="bars bigbars"><i></i><i></i><i></i></div>
  <div class="base stripe"></div>
  <div class="trim">
    <span class="hole"></span>
    <img class="stk" src="../img/logo/expobusiness-stacked-reverse.svg" alt="ExpoBusiness Travel Services">
    <p class="grp"><span class="ph" style="color:#ffb27d">[Delegation or trip name]</span></p>
  </div>
</section>
<section class="page back">
  <div class="trim">
    <span class="hole"></span>
    <h3>If found, please return</h3>
    <div class="f"><div class="field"></div><span class="label">Name</span></div>
    <div class="f"><div class="field"></div><span class="label">Mobile</span></div>
    <div class="f"><div class="field"></div><span class="label">Hotel</span></div>
    <div class="f"><div class="field"></div><span class="label">Trip / delegation</span></div>
    <div class="co"><b>Coordinator</b>ExpoBusiness Travel Services<br>inquiry@expobusinesstravel.ph</div>
    <div class="foot">
      <div class="lockup">
        <img class="eb" src="../img/logo/expobusiness-horizontal-colour.svg" alt="ExpoBusiness Travel Services">
        <span class="rule"></span>
        <div class="partner"><small>In partnership<br>with</small><img src="img/immaculate-connections.png" alt="Immaculate Connections Tour Services"></div>
      </div>
    </div>
  </div>
</section>
<script src="collateral.js"></script>
</body>
</html>
